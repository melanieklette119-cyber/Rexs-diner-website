<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rex's Diner</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #f7e6c4;
      color-scheme: dark;
    }

    body {
      position: relative;
      display: none;
      /* Standardmäßig komplett ausblenden */
    }

    body.ui-open {
      display: block;
      visibility: visible;
      opacity: 1;
      /* Nur anzeigen, wenn die Klasse ui-open aktiv ist */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #111;
    }

    #close {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      background: rgba(30, 30, 30, .95);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    #fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #201516;
      z-index: 10;
      font-size: 16px;
      color: #f7e6c4;
    }

    #fallback.hidden {
      display: none;
    }
  </style>
</head>

<body class="ui-hidden">

  <div id="fallback">Seite wird geladen...</div>

  <button id="close">Schliessen</button>

  <iframe id="page" title="Rex's Diner Bestellkarte" src="about:blank"></iframe>

  <script>
    const page = document.getElementById("page");
    const fallback = document.getElementById("fallback");
    const closeButton = document.getElementById("close");

    function openUI(url) {
      if (url) page.src = url;
      document.body.classList.remove("ui-hidden");
      document.body.classList.add("ui-open");
      fallback.classList.remove("hidden");
      setTimeout(() => fallback.classList.add("hidden"), 700);
    }

    function closeUI() {
      page.src = "about:blank";
      fallback.classList.remove("hidden");
      document.body.classList.remove("ui-open");
      document.body.classList.add("ui-hidden");
    }

    function openExternal(url) {
      if (!url) return;
      if (typeof window.invokeNative === "function") {
        window.invokeNative("openUrl", url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    closeButton.addEventListener("click", () => {
      closeUI();
      fetch(`https://${GetParentResourceName()}/close`, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=UTF-8" },
        body: JSON.stringify({})
      }).catch(() => { });
    });

    window.addEventListener("message", (event) => {
      const data = event.data;

      if (data.action === "open") {
        openUI(data.url);
      }

      if (data.action === "close") {
        closeUI();
      }

      if (data.action === "openExternal") {
        openExternal(data.url);
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "Escape") {
        closeButton.click();
      }
    });

    // Beim Starten sofort schließen
    window.addEventListener("load", () => {
      closeUI();
    });
  </script>

</body>

</html>
