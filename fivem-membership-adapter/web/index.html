<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rex's Diner</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070b;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    body {
      position: relative;
      display: none;
    }

    body.open {
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #111;
    }

    #close {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 2;
      padding: 8px 12px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: rgba(34, 34, 34, 0.9);
      cursor: pointer;
    }

    #fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 11, 0.96);
      z-index: 1;
      font-size: 16px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.8);
      transition: opacity 0.2s ease;
    }

    #fallback.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="fallback">Seite wird geladen...</div>
  <button id="close" type="button">Schliessen</button>
  <iframe id="page" title="Rex's Diner Bestellkarte" src="about:blank"></iframe>
  <script>
    const page = document.getElementById('page')
    const fallback = document.getElementById('fallback')

    const show = (url) => {
      if (url) page.src = url
      fallback.classList.add('hidden')
      document.body.classList.add('open')
    }

    const hide = () => {
      page.src = 'about:blank'
      fallback.classList.remove('hidden')
      document.body.classList.remove('open')
    }

    const openExternal = (url) => {
      if (!url) return
      if (typeof window.invokeNative === 'function') {
        window.invokeNative('openUrl', url)
      } else {
        window.open(url, '_blank', 'noopener,noreferrer')
      }
    }

    const close = () => fetch(`https://${GetParentResourceName()}/close`, { method: 'POST', body: '{}' })
      .catch(() => {})

    document.getElementById('close').addEventListener('click', close)
    window.addEventListener('message', (event) => {
      if (event.data.action === 'open') {
        show(event.data.url)
      }
      if (event.data.action === 'openExternal') {
        openExternal(event.data.url)
      }
      if (event.data.action === 'close') {
        hide()
      }
    })
    document.addEventListener('keyup', (event) => {
      if (event.key === 'Escape') close()
    })
  </script>
</body>
</html>
