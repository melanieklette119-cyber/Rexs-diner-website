<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="googledocs" name="googledocs" class="googledocs">
            <div class="tablet-shell">
                <div class="tablet-header">
                    <div class="brand-lockup">
                        <div class="brand-mark" aria-hidden="true">R</div>
                        <div class="title-wrap">
                            <span class="title">Rex&apos;s Diner</span>
                            <span class="subtitle"><span class="status-dot"></span>Online-Bestellung</span>
                        </div>
                    </div>
                    <div class="window-actions">
                        <span class="secure-label">REX CONNECT</span>
                        <button id="closeTablet" type="button" aria-label="Schließen">&times;</button>
                    </div>
                </div>
                <div class="frame-wrap">
                    <iframe src="about:blank" title="Rex's Diner Bestellung"></iframe>
                </div>
            </div>
        </div>
    </body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="script.js"></script>
</html>
